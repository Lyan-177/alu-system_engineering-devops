<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  :root {
    --sky-top: #6f97b8;
    --sky-low: #cfe0e8;
    --paper: #fbfbf7;
    --ink: #1f2326;
    --hat: #3b4148;
    --apple: #5f8a4b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Georgia, "Palatino Linotype", serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse 160px 46px at 18% 24%, #fff 60%, transparent 62%),
      radial-gradient(ellipse 220px 58px at 80% 16%, #fff 60%, transparent 62%),
      radial-gradient(ellipse 140px 40px at 70% 58%, #ffffffcc 60%, transparent 62%),
      linear-gradient(var(--sky-top), var(--sky-low));
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
  }
  main { text-align: center; max-width: 34rem; }

  .sheet {
    width: 200px;
    height: 264px;
    margin: 0 auto 2rem;
    background:
      linear-gradient(225deg, var(--sky-low) 0 28px, #d9d9cf 28px 29px, transparent 29px),
      var(--paper);
    clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 28px, 100% 100%, 0 100%);
    box-shadow: 0 0 0 2px var(--ink);
    filter: drop-shadow(0 18px 16px #1f232633);
    animation: settle 1.1s cubic-bezier(.2, .8, .3, 1) both;
  }
  @keyframes settle {
    from { transform: translateY(-40px) rotate(-7deg); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  h1 {
    margin: 0 0 1.5rem;
    font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive;
    font-weight: 400;
    font-size: clamp(2.2rem, 7vw, 3.6rem);
    line-height: 1.15;
    color: var(--hat);
  }
  p { margin: 0 auto 1.75rem; max-width: 28rem; font-size: 1.1rem; line-height: 1.6; }
  .code { font-weight: 700; }
  a {
    display: inline-block;
    padding: .7rem 1.4rem;
    background: var(--ink);
    color: var(--paper);
    border-radius: 2px;
    text-decoration: none;
    font-size: 1rem;
  }
  a:hover { background: var(--apple); }
  a:focus-visible { outline: 3px solid var(--apple); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
</style>
</head>
<body>
  <main>
    <div class="sheet" role="img" aria-label="A blank sheet of paper"></div>
    <h1>Ceci n'est pas une page.</h1>
    <p><span class="code">Error 404.</span> Nothing exists at this address. Check the link for typos, or head back to the home page.</p>
    <a href="/">Go to the home page</a>
  </main>
</body>
</html>
